name: Update Daily Brief

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 KST 06:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect data
        run: python src/collector.py

      - name: Build site
        run: python src/build_site.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "변경사항 없음"
            exit 0
          fi
          git commit -m "chore: auto-update daily brief data [$(TZ=Asia/Seoul date +%F)]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push 재시도 ($i/5)"
            sleep 5
          done
          exit 1
