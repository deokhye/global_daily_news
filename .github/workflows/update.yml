name: Update Global Daily News

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 KST 06:00 (UTC 21:00)
  workflow_dispatch:        # 수동 실행 (Actions 탭 > Run workflow)
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect data
        run: python src/collector.py

      - name: Build site
        run: python src/build_site.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A docs data

          if git diff --cached --quiet; then
            echo "변경 사항이 없어 커밋을 건너뜁니다."
            exit 0
          fi

          git commit -m "chore: daily update $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"

          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "push 성공 (시도 ${i}회)"
              exit 0
            fi
            echo "push 실패, 재시도 ${i}/5"
            sleep $((i * 3))
          done

          echo "push 5회 모두 실패"
          exit 1
